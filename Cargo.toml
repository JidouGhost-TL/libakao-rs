[package]
name = "libakao"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
readme = "README.md"
repository = "https://github.com/JidouGhost-TL/libakao-rs"
description = "Standalone pure-Rust PlayStation AKAO music sequencer built on libspu2"
keywords = ["ps1", "akao", "sequencer", "spu", "audio"]
categories = ["multimedia::audio", "emulators", "no-std"]

[features]
default = ["std"]
std = ["libspu2/std"]

[dependencies]
libspu2 = { path = "/mnt/data/code/libspu2-rs", default-features = false }
